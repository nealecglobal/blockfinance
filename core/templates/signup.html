{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - BlockInvest</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Optional custom style -->
    <style>
        body {
            background: linear-gradient(135deg, #0d6efd, #0b3d91);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .signup-card {
            border-radius: 15px;
            overflow: hidden;
        }

        .form-control {
            border-radius: 10px;
        }

        .btn-custom {
            border-radius: 10px;
            font-weight: 600;
        }

        .logo {
            font-weight: bold;
            font-size: 24px;
            color: #0d6efd;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">

            <div class="card signup-card shadow-lg">
                <div class="card-body p-4">

                    <div class="text-center mb-4">
                        <div class="logo">BlockInvest</div>
                        <p class="text-muted">Create your investment account</p>
                    </div>

                    <form method="POST">
                        {% csrf_token %}

                        <!-- Username -->
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" name="username" class="form-control" required>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" required>
                        </div>

                        <!-- Password -->
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" name="password1" class="form-control" required>
                        </div>

                        <!-- Confirm Password -->
                        <div class="mb-3">
                            <label class="form-label">Confirm Password</label>
                            <input type="password" name="password2" class="form-control" required>
                        </div>

                        <!-- Referral Code -->
                        <div class="mb-3">
                            <label class="form-label">Referral Code (Optional)</label>
                            <input type="text" name="referral_code" class="form-control" placeholder="Enter referral code">
                        </div>

                        <!-- Submit -->
                        <button type="submit" class="btn btn-primary w-100 btn-custom">
                            Create Account
                        </button>
                    </form>

                    <p class="text-center mt-3">
                        Already have an account?
                        <a href="{% url 'login' %}" class="text-primary">Login</a>
                    </p>

                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
